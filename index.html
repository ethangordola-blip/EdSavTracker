<title>Baby weeks</title>
<style>
:root{
  --bg:#f6ece8; --surface:#fffaf7; --line:#e6d6cf;
  --ink:#3a2832; --muted:#7f6873; --accent:#8c4f6b; --accent-soft:#efdde4;
  --check:#5c8a6c; --alert:#a94a35; --alert-soft:#f6e0d8;
  --moon-off:#dccbc5;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a1418; --surface:#241c21; --line:#3a2e35;
    --ink:#e6d6ca; --muted:#a8958f; --accent:#e3ac7e; --accent-soft:#3a2b27;
    --check:#8fb59a; --alert:#e8917a; --alert-soft:#3a2420; --moon-off:#3d3137;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1418; --surface:#241c21; --line:#3a2e35;
  --ink:#e6d6ca; --muted:#a8958f; --accent:#e3ac7e; --accent-soft:#3a2b27;
  --check:#8fb59a; --alert:#e8917a; --alert-soft:#3a2420; --moon-off:#3d3137;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.5 var(--sans);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) calc(84px + env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,0px);
  -webkit-tap-highlight-color:transparent;
}
main{max-width:620px;margin:0 auto;padding:0 20px}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
p{margin:0}
.hidden{display:none!important}

/* Week header */
.hero{padding:22px 0 8px}
.age{color:var(--muted);font-size:16px}
.hero h1{font-size:52px;line-height:1.05;letter-spacing:-.01em;margin-top:6px}
.hero .wtitle{font-family:var(--serif);font-style:italic;font-size:22px;margin-top:2px}
.hero .range{color:var(--muted);font-size:15px;margin-top:4px}
.browsing{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;
  background:var(--accent-soft);border-radius:14px;padding:10px 10px 10px 14px;font-size:15px}
.browsing button{background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}

.moons{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin:22px -4px 6px}
.moons button{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;border-radius:10px}
.moons svg{width:24px;height:24px;display:block}
.moons .bgc{fill:none;stroke:var(--moon-off);stroke-width:1.5}
.moons .lit{fill:var(--moon-off)}
.moons .past .lit{fill:var(--accent);opacity:.55}
.moons .now .lit{fill:var(--accent)}
.moons .now .bgc{stroke:var(--accent)}
.moons span{font-size:11px;color:var(--muted);line-height:1}
.moons .sel{background:var(--accent-soft)}
.moons .sel span{color:var(--ink);font-weight:600}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 6px}
.pager button{min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px}
.pager button:disabled{opacity:.35}

.summary{font-family:var(--serif);font-size:20px;line-height:1.45;margin:22px 0 4px}

/* Sections */
section{margin-top:30px}
section > h2{font-size:23px;margin-bottom:10px}
section > h2 small{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--muted);margin-left:8px}
h3{font-size:17px;margin:14px 0 6px}
ul.facts{list-style:none;margin:0;padding:0}
ul.facts li{position:relative;padding-left:20px;margin:8px 0}
ul.facts li::before{content:"";position:absolute;left:3px;top:.65em;width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.7}

.doctor{background:var(--alert-soft);border-radius:18px;padding:18px 18px 16px;margin-top:30px}
.doctor h2{font-size:23px;margin-bottom:6px;color:var(--alert)}
.doctor ul.facts li::before{background:var(--alert)}
.doctor .always{border-top:1px solid color-mix(in srgb,var(--alert) 25%,transparent);margin-top:12px;padding-top:12px;font-size:15px}

/* Checklists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.item{display:flex;gap:14px;align-items:flex-start;padding:15px 16px;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);margin-top:-1px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:16px;height:16px;opacity:0;stroke:var(--surface);stroke-width:3;fill:none}
.item input:checked + .box{background:var(--check);border-color:var(--check)}
.item input:checked + .box svg{opacity:1}
.item input:focus-visible + .box{outline:3px solid var(--accent);outline-offset:2px}
.item .txt{flex:1}
.act-name{font-weight:600}
.act-time{display:inline-block;font-size:14px;color:var(--muted);margin-left:2px}
.act-how{font-size:15.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.note-safe{font-size:15px;color:var(--muted);margin-top:10px}

textarea{width:100%;min-height:130px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:14px 16px;font-size:17px;line-height:1.5;resize:vertical}
.saved{font-size:14px;color:var(--muted);height:20px;margin-top:4px}

.sleepcard{border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-top:30px}
.sleepcard h2{font-size:19px;margin-bottom:6px}
.sleepcard p{font-size:15.5px}
.fine{font-size:14px;color:var(--muted);margin:26px 0 10px;line-height:1.5}

/* Log */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.quick button{min-height:84px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600}
.quick button .ic{font-size:26px;line-height:1}
.quick button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.panel h3{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.chips button{min-height:46px;padding:0 18px;border-radius:23px;border:1px solid var(--line);background:var(--bg)}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:17px}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.row .primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.today div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.today b{display:block;font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.2}
.today small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.sleeping{margin-top:12px;background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:15.5px}
.day h3{font-size:18px;margin:24px 0 8px}
.entry{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .t{min-width:72px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.entry .d{flex:1}
.entry .d small{display:block;color:var(--muted);font-size:14px}
.entry button{background:none;border:0;color:var(--muted);min-width:44px;min-height:44px;font-size:22px;border-radius:10px}
.empty{color:var(--muted);margin-top:22px}
.more{display:block;width:100%;margin-top:14px;min-height:50px;border-radius:14px;border:1px solid var(--line);background:transparent;font-weight:600}

/* Info */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{min-height:46px;border:0;border-radius:10px;background:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:600}
.info p{margin:8px 0}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);
  background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs button{min-height:56px;border:0;background:none;color:var(--muted);font-size:16px;font-weight:600;border-radius:12px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:9;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div id="view-week"></div>
  <div id="view-log" class="hidden"></div>
  <div id="view-info" class="hidden"></div>
</main>
<nav class="tabs" aria-label="Sections">
  <button data-tab="week" aria-current="page">Weeks</button>
  <button data-tab="log">Log</button>
  <button data-tab="info">Safety &amp; info</button>
</nav>
<div id="toast" class="toast hidden" role="status"></div>

<script>
/* ---------- Settings: change the birth date here ---------- */
const BIRTH = { year: 2026, month: 10, day: 3 }; // month is 1–12

/* ---------- Content (based on CDC and AAP guidance) ---------- */
const WEEKS = [
{t:"The first days", s:"Your baby is mostly sleeping, feeding and adjusting to life outside the womb.",
dev:["Strong newborn reflexes: rooting (turning toward a touch on the cheek), sucking, gripping your finger, and startling at sudden noises or movement.","Sees best up close, about the distance from your arms to your face during a feed.","Losing a little weight in the first days is expected. Your pediatrician checks that it comes back."],
feed:["Breastfed babies usually feed 8–12 times in 24 hours. Feed on hunger cues: rooting, hands to mouth, lip smacking. Crying is a late cue.","Formula-fed babies take small amounts often. Ask your pediatrician how much to offer.","Wet nappies should increase each day. Poop changes from dark, sticky meconium to greenish, then yellow."],
sleep:["Sleeps most of the day and night in short stretches. Day and night aren't sorted out yet, and that's normal."],
watch:["Yellowish skin or eyes (jaundice) is common and often starts on the face.","Keep the cord stump clean and dry. It falls off on its own.","The first pediatrician visit is usually 3–5 days after birth."],
call:["Yellow color spreading to the belly or legs, or a yellow baby who is very sleepy or feeding poorly.","Fewer wet nappies than your care team told you to expect.","Cord area that is red, swollen, smelly or oozing.","Not waking for feeds, or too sleepy to feed."],
ms:["Turns toward a touch on the cheek","Grips your finger","Startles at a sudden noise","Calms when held or hearing your voice","Looks at your face up close"],
act:[["Skin-to-skin","Hold baby in just a nappy against your bare chest while you sit up, awake. Drape a blanket over their back.","As long as you're both comfy and you're alert"],
["Face time","When baby is calm and alert, hold them a forearm's length from your face. Make slow, simple expressions and let them look.","1–2 minutes"],
["Chest tummy time","Recline and lay baby tummy-down on your chest. Talk so they try to lift or turn their head. This counts as tummy time.","1–2 minutes, a few times a day"],
["Talk and hum","Narrate what you're doing in a calm voice: changes, feeds, getting dressed. Baby already knows your voice.","Any awake time"],
["Finger grip","Place your finger in baby's palm and let them grip. Talk softly. Don't pull.","A minute or two"]]},

{t:"Getting to know each other", s:"Short alert windows appear, often just after a feed.",
dev:["More moments of quiet alertness, when baby looks around calmly.","May turn toward familiar voices.","Jerky, jittery arm and leg movements are normal.","Many babies are back to birth weight around 2 weeks. Your pediatrician tracks this."],
feed:["Still 8–12 feeds in 24 hours for breastfed babies. Some days bring clusters of very frequent feeds.","Fullness signs: slowing down, turning away, relaxed hands.","The AAP recommends a daily vitamin D supplement for breastfed and partly breastfed babies. Ask your pediatrician."],
sleep:["Help baby learn day from night: normal light and sounds by day, dark and quiet for night feeds."],
watch:["Baby acne, peeling skin and tiny white spots (milia) are common and fade on their own.","The cord stump usually falls off in the first few weeks. A drop of blood when it does is normal."],
call:["Vomiting that is forceful, green, or happens after every feed.","Blood in poop.","Feeding poorly or too sleepy to feed.","Fewer wet nappies, a dry mouth, or a sunken soft spot."],
ms:["Has short calm, alert periods","Turns toward a familiar voice","Briefly lifts or turns head in tummy time","Calms when picked up"],
act:[["Floor tummy time","Lay baby tummy-down on a blanket on the floor. Get down at eye level and talk. Stop when they fuss.","1–2 minutes, 2–3 times a day"],
["Voice hunt","With baby on their back, talk softly from one side, then the other. Watch for a head turn.","A few tries"],
["Gentle massage","With warm hands, stroke slowly down arms and legs. Stop if baby turns away or fusses.","About 5 minutes"],
["Read aloud","Read anything: a recipe, the news, a picture book. The rhythm of your voice is what matters.","5–10 minutes"]]},

{t:"Wider eyes", s:"Awake periods grow a little longer, and so might the fussy spells.",
dev:["May briefly follow your face as it moves.","Hands are mostly in fists, often near the mouth.","Many babies get fussier in the late afternoon or evening."],
feed:["Growth spurts are common in the early weeks. Baby may want to feed more often for a day or two.","Spitting up is common. If baby is gaining weight and seems comfortable, it's usually not a concern.","Burp partway through and after feeds."],
sleep:["One longer stretch may begin to appear. Keep putting baby down on their back, every time."],
watch:["Crying tends to increase over the coming weeks. That's normal, but tiring, so plan for breaks.","How are you? Baby blues usually ease within about 2 weeks. If low mood, anxiety or hopelessness last longer, talk to your doctor."],
call:["A cry that sounds very different (high-pitched or weak), especially with other signs of illness.","Spitting up with poor weight gain, or baby seems in pain during feeds.","Signs of dehydration: fewer wet nappies, dry mouth, sunken soft spot."],
ms:["Follows your face a little way to one side","Lifts head briefly on tummy","Makes small throaty sounds","Brings a hand near the mouth"],
act:[["Face tracking","With baby alert, bring your face close and slowly move it a little to one side, then back. Try the other side.","1–2 minutes"],
["Tummy time","On a blanket on the floor or across your lap. Try after a nappy change rather than straight after a feed.","2–3 minutes, a few times a day"],
["Sing","Sing anything, slowly and softly. Repeating the same few songs helps baby recognize them.","A few minutes"],
["Bicycle legs","On their back, hold both legs and gently pedal them in slow circles. Can help with passing gas.","About 1 minute"],
["Slow sway","Hold baby securely against your chest, head supported, and sway gently side to side.","As long as it soothes"]]},

{t:"Nearly a month", s:"Movements get smoother and baby looks around more.",
dev:["Neck is getting stronger; may lift head briefly in tummy time.","Stares at strong contrasts, like a window frame against the sky.","Reacts to sounds by startling, quieting or blinking."],
feed:["Patterns may settle a little. Keep following hunger and fullness cues.","Only breast milk or formula. No water, juice or honey."],
sleep:["A short bedtime routine can start now: dim light, fresh nappy, a feed, a quiet song."],
watch:["The 1-month well visit is usually around now. Jot your questions in the notes below.","If baby always turns their head the same way, alternate which end of the crib their head goes."],
call:["Doesn't react to loud sounds.","Seems very floppy or very stiff.","Doesn't seem to look at faces at all."],
ms:["Lifts head briefly in tummy time","Watches faces intently","Reacts to loud sounds","Moves both arms and both legs"],
act:[["Floor tummy time","Lie on the floor facing baby so they lift their head to see you.","3–5 minutes, 2–3 times a day"],
["Take turns talking","Say something, then pause as if waiting for a reply. Respond to any sound or wiggle.","2–3 minutes"],
["Window watch","Hold baby near a window to look at light, shadows and moving leaves. Keep direct sun out of their eyes.","About 5 minutes"],
["Side-lying play","Lay baby on their side on the floor, your hand behind their back, facing you. Then switch sides.","1–2 minutes per side"]]},

{t:"Coos are coming", s:"Baby may start making soft vowel sounds and watching you more closely.",
dev:["Early cooing: soft “ooh” and “aah” sounds.","Hands open more often.","May hold head up briefly when held upright at your shoulder. Keep a hand ready to support."],
feed:["Bottle feeding: hold baby fairly upright, let them pause, and never prop the bottle.","If breastfeeding still hurts, ask your pediatrician about a lactation specialist."],
sleep:["Watch for tired cues (yawning, staring off, rubbing eyes) and settle baby before they're overtired."],
watch:["Crying often peaks around 6–8 weeks. If you feel overwhelmed, lay baby on their back in the crib and step away for a few minutes.","Never shake a baby."],
call:["A flat spot developing on the head: mention it at your next visit.","Crying for hours along with fever, vomiting or poor feeding.","Your own mood: feeling down, anxious or unable to cope most days."],
ms:["Makes cooing sounds","Follows a moving face further","Opens hands at times","Holds head up briefly when held upright"],
act:[["Lap tummy time","Sit and lay baby tummy-down across your thighs. Gently rub their back and talk.","2–3 minutes"],
["Copy their sounds","When baby coos, coo back with the same sound. Wait for the next one.","As long as they're interested"],
["Hand watch","Slowly move your open hand across baby's view, wiggling your fingers.","1–2 minutes"],
["Switch sides","Alternate the arm you hold and feed with, so baby looks both ways.","Throughout the day"]]},

{t:"First smiles?", s:"Many babies start smiling back at you around 6–8 weeks. Some take longer, and that's normal.",
dev:["Social smiles, in response to your face or voice, may appear.","Head control improves in tummy time.","Fussiness and crying often peak around now."],
feed:["Another growth spurt is common; cluster feeding may return for a few days."],
sleep:["Some babies start one longer night stretch. Wide variation is normal.","Try putting baby down drowsy but awake sometimes. It's practice, not a test."],
watch:["Soothing ideas: skin-to-skin, gentle rocking, a walk outside, a quiet, dim room.","If you gave birth, keep your own postpartum check-ups too."],
call:["Crying that can't be soothed and seems different, especially with fever, vomiting or poor feeding.","Fewer wet nappies, or feeding much less than usual."],
ms:["Smiles when you smile or talk","Coos","Watches you as you move","Lifts head higher on tummy"],
act:[["Smile game","Get close, smile big and talk in a sing-song voice. Wait: smiles take a few seconds to arrive.","2–3 minutes"],
["Tummy time","Several short sessions through the day, building up gradually.","3–5 minutes at a time"],
["Arm hugs","On their back, gently cross baby's arms over their chest, then open them wide. Slow and gentle.","5–6 times"],
["Nappy-change chat","Use changes for face-to-face time: name body parts, touch toes, sing.","Every change"],
["Sway to music","Hold baby securely, head supported, and sway or slow-step to a song.","A song or two"]]},

{t:"Building strength", s:"Smiles come more often and tummy time gets a little easier.",
dev:["Smiles more, especially at familiar faces.","Lifts head more steadily in tummy time.","Listens closely to voices and may coo back."],
feed:["Feeds may get quicker as baby gets more efficient.","Keep following baby's cues rather than the clock."],
sleep:["Total sleep stays high, but awake windows are a bit longer."],
watch:["The AAP suggests building up to 15–30 minutes of tummy time a day, spread out, by about 7 weeks.","If baby dislikes tummy time, keep sessions short and frequent, and use chest or lap time too."],
call:["Not lifting head at all in tummy time.","Seems to use one side of the body much less than the other."],
ms:["Smiles at familiar faces","Lifts head steadily for a few moments","Coos back when you talk","Moves both arms and legs equally"],
act:[["Tummy time","Several short sessions through the day. Get down at baby's level and make it social.","15–30 minutes total per day"],
["Where's that sound?","Call baby's name from one side, then the other. Celebrate any head turn.","A few tries"],
["Texture touch","Let baby feel soft textures (your sleeve, a towel, your cheek) while you name them.","A few minutes"],
["Clap and sing","Sing a rhyme while gently bringing baby's hands together in a soft clap.","One or two songs"]]},

{t:"Two months", s:"A big check-in: the 2-month well visit and the first CDC milestone list.",
dev:["Smiles when you talk or smile.","Makes sounds other than crying.","Holds head up when on tummy, at least briefly."],
feed:["Keep feeding on cue. Your pediatrician checks weight gain at the 2-month visit."],
sleep:["Some babies are sleeping longer stretches at night; others still wake often. Both are normal."],
watch:["The 2-month well visit usually includes routine vaccines. Ask what mild reactions to expect.","The milestones below are the CDC's 2-month list. Most babies do these by 2 months."],
call:["If baby isn't doing several of these milestones, or you're worried, talk to your pediatrician. Don't wait.","After vaccines: crying you can't soothe for hours, or any of the warning signs below."],
ms:["Calms down when spoken to or picked up","Looks at your face","Seems happy to see you when you walk up","Smiles when you talk to or smile at them","Makes sounds other than crying","Reacts to loud sounds","Watches you as you move","Looks at a toy for several seconds","Holds head up when on tummy","Moves both arms and both legs","Opens hands briefly"],
act:[["Face-level tummy time","Lie on your tummy facing baby, noses close. Talk and make faces so they keep lifting.","15–30 minutes total per day"],
["Conversation","Talk, then pause. When baby coos, answer. Take turns.","A few minutes"],
["Home tour","Carry baby around and name what you see: the window, the door, the plant.","About 5 minutes"],
["Sound play","Try gentle sounds: whisper, hum, click your tongue. Notice which ones they like.","A few minutes"]]},

{t:"Chatting", s:"Baby is more vocal and social, and smiles come more easily.",
dev:["More cooing and gurgling, especially when you talk to them.","May push up a little on forearms in tummy time.","Recognizes you and may get excited when you appear."],
feed:["Baby may get distracted during feeds. A quieter room can help."],
sleep:["Some babies sleep longer at night now; many don't. Both are fine."],
watch:["Babies develop at their own pace. Compare your baby to their own progress, not to other babies."],
call:["Not smiling at people yet, or not watching faces.","Doesn't react to loud sounds."],
ms:["Coos and gurgles back","Pushes up a little on forearms","Gets excited when seeing you","Smiles easily"],
act:[["Forearm tummy time","Get down in front of baby so they push up on forearms to see you.","Short sessions, building the daily total"],
["Narrate and pause","Describe your day in a sing-song voice and leave gaps for baby's replies.","Any awake time"],
["Hands together","On their back, gently bring baby's hands together over their chest so they can feel and see them.","A minute or two"],
["Kisses and names","Gentle touches and kisses on fingers, toes and cheeks while you name each one.","A few minutes"]]},

{t:"Discovering hands", s:"Baby may notice their own hands and start swiping at things.",
dev:["Watches own hands and brings them to the mouth.","Swipes at things nearby.","Head is steadier when held upright."],
feed:["Sucking on hands is normal and self-soothing. It isn't always a hunger sign."],
sleep:["Keep the sleep space bare as baby moves more: no toys, pillows, blankets or bumpers."],
watch:["If you swaddle, the AAP advises stopping as soon as baby shows signs of trying to roll."],
call:["Hands always tightly fisted, or one side used much less than the other.","Head very floppy when held upright."],
ms:["Watches own hands","Brings hands to mouth","Swipes at things nearby","Holds head steadier when upright"],
act:[["Finger swipe","Hold your hand within reach above baby's chest and move it slowly. Let them swipe at it.","2–3 minutes"],
["Side-lying play","On the floor, baby on their side with your hand behind their back, facing you. Switch sides.","About 2 minutes per side"],
["Forearm carry","Hold baby tummy-down along your forearm, head supported near your elbow, other hand on their back. Walk slowly.","A few minutes"],
["Tummy time","Keep building the daily total with short, frequent sessions.","15–30+ minutes total per day"]]},

{t:"Stronger and steadier", s:"Head control and push-ups keep improving.",
dev:["Holds head steady when held upright.","Pushes up on forearms in tummy time.","Kicks and stretches legs more strongly.","Recognizes familiar people from a distance."],
feed:["Only breast milk or formula. Solid food isn't recommended until around 6 months."],
sleep:["On their back for every sleep, in their own sleep space, even if they wriggle."],
watch:["Babies can roll unexpectedly. Never leave baby alone on a bed, sofa or changing table, even for a moment."],
call:["Not following moving things with their eyes.","Not holding head up when on tummy."],
ms:["Holds head steady when upright","Pushes up on forearms","Kicks legs strongly","Recognizes familiar people"],
act:[["Knee recline chat","Sit with knees bent and lean baby back against your thighs, facing you, head supported. Talk and make faces.","A few minutes"],
["Rolling practice","On the floor, on their back, gently guide baby's hip over to their side, then back. Let them do what they can.","A few gentle tries each side"],
["Counting rhyme","Say a counting rhyme while touching each finger and toe.","One or two rounds"],
["Tummy time","Lie facing baby and encourage them to push up to see you.","Short sessions, building the daily total"]]},

{t:"Three months", s:"Baby is more active, more chatty and more fun to play with.",
dev:["Pushes up on forearms and holds head up longer.","Opens and closes hands, swipes, and may start to grab.","Makes more varied sounds and may begin to chuckle."],
feed:["Feeds may be less frequent but larger. Keep following cues."],
sleep:["Many babies sleep in longer stretches, but night waking is still normal."],
watch:["The next well visit is usually at 4 months. The CDC's 4-month milestones are the next thing to look at.","Rolling may begin soon. Play on the floor, not on the bed."],
call:["Doesn't follow moving things with eyes, react to loud sounds, smile at people, or hold head up on tummy.","Loses skills they used to have.","Any time you're worried. You know your baby best."],
ms:["Holds head up longer on tummy","Opens and closes hands","Swipes at or grabs nearby things","Makes varied sounds","Smiles and responds to faces"],
act:[["Reach and grab","Hold your fingers just within reach and let baby grab them.","2–3 minutes"],
["Funny faces","Stick your tongue out or open your mouth wide, then pause. Some babies copy.","A few minutes"],
["Rolling practice","Floor time on their back. Guide hips gently to the side and let them try.","A few tries each side"],
["Tummy raspberries","On their back, blow gentle raspberries on their tummy. Stop if they look away.","About a minute"],
["Tummy time","Lie facing baby; keep it social and short.","15–30+ minutes total per day"]]}
];

const ALWAYS = `<p><strong>Fever:</strong> under 3 months, a temperature of 100.4°F (38°C) or higher means call your pediatrician right away.</p><p style="margin-top:6px"><strong>Call 911</strong> for trouble breathing, blue or grey lips or skin, a seizure, or if baby is very hard to wake.</p>`;
const SAFE_SLEEP = `Every sleep, day and night: on their back, in their own crib or bassinet with a firm, flat mattress and a fitted sheet only. No pillows, blankets, bumpers or toys. Share your room, not your bed. Never fall asleep with baby on a sofa or armchair, and don't let them get too hot.`;
const ACT_SAFE = `Only when baby is awake and alert, always with you watching, on a firm, flat surface or in your arms. Stop when baby looks away, fusses or seems tired.`;

/* ---------- Storage ---------- */
const KEY = "babyweeks:v1";
const blank = () => ({checks:{}, notes:{}, log:[], theme:"auto"});
function load(){ try{ const r = localStorage.getItem(KEY); if(r) return Object.assign(blank(), JSON.parse(r)); }catch(e){} return blank(); }
let S = load();
let warned = false;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ if(!warned){ toast("Can't save on this device. Private Browsing may be on."); warned = true; } return false; }
}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pl = (n, w) => `${n} ${w}${n===1?"":"s"}`;
const fmtDate = d => d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
const fmtTime = d => d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
const pad = n => String(n).padStart(2,"0");
const toLocalInput = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dayKey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
function dur(ms){ const m = Math.max(0, Math.round(ms/60000)); const h = Math.floor(m/60); return h ? `${h}h ${m%60}m` : `${m}m`; }
let toastTimer;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.remove("hidden"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.add("hidden"),2600); }

function daysOld(){
  const n = new Date();
  return Math.round((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()) - Date.UTC(BIRTH.year,BIRTH.month-1,BIRTH.day)) / 864e5);
}
function currentWeek(){ const d = daysOld(); return d < 0 ? 1 : Math.min(12, Math.floor(d/7)+1); }
function ageText(){
  const d = daysOld();
  if(d < 0) return `Arriving in ${pl(-d,"day")}`;
  if(d === 0) return "Born today";
  const w = Math.floor(d/7), r = d%7;
  if(w === 0) return `${pl(r,"day")} old`;
  return r ? `${pl(w,"week")}, ${pl(r,"day")} old` : `${pl(w,"week")} old`;
}
function moonSVG(f){
  const rx = (10*Math.abs(1-2*f)).toFixed(2);
  const lit = f >= 1 ? `<circle class="lit" cx="12" cy="12" r="10"/>` : `<path class="lit" d="M12 2A10 10 0 0 1 12 22A${rx} 10 0 0 ${f>0.5?1:0} 12 2Z"/>`;
  return `<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="bgc" cx="12" cy="12" r="10"/>${lit}</svg>`;
}
const CHECK = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;

/* ---------- Week view ---------- */
let view = currentWeek();
function renderWeek(){
  const w = view, W = WEEKS[w-1], now = currentWeek(), d = daysOld();
  const start = new Date(BIRTH.year, BIRTH.month-1, BIRTH.day + (w-1)*7);
  const end = new Date(start); end.setDate(end.getDate()+6);
  const ck = S.checks["w"+w] || {m:{}, a:{}};
  const mDone = W.ms.filter((_,i)=>ck.m && ck.m[i]).length;
  const aDone = W.act.filter((_,i)=>ck.a && ck.a[i]).length;
  const facts = arr => `<ul class="facts">${arr.map(x=>`<li>${x}</li>`).join("")}</ul>`;

  let moons = "";
  for(let i=1;i<=12;i++){
    const cls = [i<now?"past":"", i===now&&d>=0?"now":"", i===w?"sel":""].join(" ");
    moons += `<button class="${cls}" data-go="${i}" aria-label="Week ${i}${i===now?", this week":""}">${moonSVG(i/12)}<span>${i}</span></button>`;
  }

  $("#view-week").innerHTML = `
  <header class="hero">
    <p class="age">${ageText()}</p>
    <h1>Week ${w}</h1>
    <p class="wtitle">${W.t}</p>
    <p class="range">${fmtDate(start)} to ${fmtDate(end)}</p>
    ${w!==now ? `<div class="browsing"><span>${w<now?"Looking back":"Looking ahead"} at week ${w}</span><button data-go="${now}">Back to this week</button></div>` : ""}
    ${d>=84 && w===12 ? `<div class="browsing"><span>You're past this 12-week guide. The CDC's free Milestone Tracker app covers what comes next.</span></div>` : ""}
  </header>
  <div class="moons" role="group" aria-label="Choose a week">${moons}</div>
  <div class="pager">
    <button data-go="${w-1}" ${w===1?"disabled":""}>${w===1?"‹ Previous":`‹ Week ${w-1}`}</button>
    <button data-go="${w+1}" ${w===12?"disabled":""}>${w===12?"Next ›":`Week ${w+1} ›`}</button>
  </div>

  <p class="summary">${W.s}</p>

  <section><h2>Development</h2>${facts(W.dev)}</section>
  <section><h2>Feeding and sleep</h2><h3>Feeding</h3>${facts(W.feed)}<h3>Sleep</h3>${facts(W.sleep)}</section>
  <section><h2>What to watch for</h2>${facts(W.watch)}</section>

  <div class="doctor"><h2>When to call the doctor</h2>${facts(W.call)}<div class="always">${ALWAYS}</div></div>

  <section><h2>Milestones <small id="mcount">${mDone} of ${W.ms.length}</small></h2>
    <div class="list">${W.ms.map((m,i)=>`<label class="item"><input type="checkbox" data-k="m" data-i="${i}" ${ck.m&&ck.m[i]?"checked":""}><span class="box">${CHECK}</span><span class="txt">${m}</span></label>`).join("")}</div>
  </section>

  <section><h2>Activities <small id="acount">${aDone} of ${W.act.length} tried</small></h2>
    <div class="list">${W.act.map((a,i)=>`<label class="item"><input type="checkbox" data-k="a" data-i="${i}" ${ck.a&&ck.a[i]?"checked":""}><span class="box">${CHECK}</span><span class="txt"><span class="act-name">${a[0]}</span> <span class="act-time">${a[2]}</span><span class="act-how" style="display:block">${a[1]}</span></span></label>`).join("")}</div>
    <p class="note-safe">${ACT_SAFE}</p>
  </section>

  <section><h2>My notes</h2>
    <textarea id="notes" placeholder="What did you notice this week? Questions for the next visit?">${esc(S.notes["w"+w]||"")}</textarea>
    <p class="saved" id="saved" aria-live="polite"></p>
  </section>

  <div class="sleepcard"><h2>Safe sleep</h2><p>${SAFE_SLEEP}</p></div>
  <p class="fine">General information based on CDC and AAP guidance, not medical advice. Babies develop at different speeds. If you're unsure or worried, call your pediatrician.</p>`;
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if(g && !g.disabled){ view = Math.min(12, Math.max(1, +g.dataset.go)); renderWeek(); window.scrollTo(0,0); }
});
$("#view-week").addEventListener("change", e => {
  const c = e.target; if(!c.dataset.k) return;
  const k = "w"+view; S.checks[k] = S.checks[k] || {m:{}, a:{}};
  S.checks[k][c.dataset.k] = S.checks[k][c.dataset.k] || {};
  if(c.checked) S.checks[k][c.dataset.k][c.dataset.i] = true; else delete S.checks[k][c.dataset.k][c.dataset.i];
  save();
  const W = WEEKS[view-1], m = Object.keys(S.checks[k].m||{}).length, a = Object.keys(S.checks[k].a||{}).length;
  $("#mcount").textContent = `${m} of ${W.ms.length}`;
  $("#acount").textContent = `${a} of ${W.act.length} tried`;
});
let noteTimer;
$("#view-week").addEventListener("input", e => {
  if(e.target.id !== "notes") return;
  S.notes["w"+view] = e.target.value;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(()=>{ if(save()) $("#saved").textContent = "Saved"; }, 400);
});

/* ---------- Log ---------- */
const TYPES = {
  feed:{label:"Feed", ic:"🍼", opts:["Left","Right","Both sides","Bottle"]},
  sleep:{label:"Sleep", ic:"🌙", opts:[]},
  nappy:{label:"Nappy", ic:"💧", opts:["Wet","Dirty","Wet + dirty"]}
};
let form = null; // {type, opt, mode:'new'|'wake'}
let showDays = 3;
const openSleep = () => S.log.find(x => x.type==="sleep" && !x.end);

function renderLog(){
  const os = openSleep();
  const now = Date.now(), today0 = new Date(); today0.setHours(0,0,0,0);
  const t0 = today0.getTime();
  const todays = S.log.filter(x => x.t >= t0);
  const feeds = todays.filter(x=>x.type==="feed");
  const nap = todays.filter(x=>x.type==="nappy");
  const wet = nap.filter(x=>/Wet/.test(x.d)).length, dirty = nap.filter(x=>/irty/.test(x.d)).length;
  let sleepMs = 0;
  S.log.filter(x=>x.type==="sleep").forEach(x => { const s=Math.max(x.t,t0), e=x.end||now; if(e>s) sleepMs += e-s; });
  const lastFeed = S.log.filter(x=>x.type==="feed").sort((a,b)=>b.t-a.t)[0];

  let html = `<header class="hero"><p class="age">${ageText()}</p><h1>Log</h1></header>
  <div class="quick">
    <button data-new="feed"><span class="ic">${TYPES.feed.ic}</span>Feed</button>
    <button data-new="sleep" class="${os?"on":""}"><span class="ic">${TYPES.sleep.ic}</span>${os?"Woke up":"Sleep"}</button>
    <button data-new="nappy"><span class="ic">${TYPES.nappy.ic}</span>Nappy</button>
  </div>`;

  if(form){
    const T = TYPES[form.type];
    const title = form.mode==="wake" ? "Woke up" : form.type==="sleep" ? "Fell asleep" : `Log a ${T.label.toLowerCase()}`;
    html += `<div class="panel"><h3>${title}</h3>
      ${T.opts.length ? `<div class="chips" role="group">${T.opts.map(o=>`<button data-opt="${o}" aria-pressed="${form.opt===o}">${o}</button>`).join("")}</div>` : ""}
      ${form.type==="feed" ? `<label class="field"><span>Amount or minutes (optional)</span><input id="f-amt" inputmode="text" placeholder="e.g. 3 oz or 15 min"></label>` : ""}
      <label class="field"><span>Time</span><input id="f-time" type="datetime-local" value="${toLocalInput(new Date())}"></label>
      ${form.mode!=="wake" ? `<label class="field"><span>Note (optional)</span><input id="f-note" placeholder="Anything to remember"></label>` : ""}
      <div class="row"><button data-cancel>Cancel</button><button class="primary" data-save>Save</button></div></div>`;
  }

  html += `<div class="today">
    <div><b>${feeds.length}</b><small>feeds today${lastFeed?`<br>last ${dur(now-lastFeed.t)} ago`:""}</small></div>
    <div><b>${dur(sleepMs)}</b><small>sleep today</small></div>
    <div><b>${nap.length}</b><small>nappies today<br>${wet} wet, ${dirty} dirty</small></div>
  </div>`;
  if(os) html += `<p class="sleeping">Asleep since ${fmtTime(new Date(os.t))} (${dur(now-os.t)}). Tap “Woke up” when baby wakes.</p>`;

  const sorted = [...S.log].sort((a,b)=>b.t-a.t);
  if(!sorted.length){
    html += `<p class="empty">Nothing logged yet. Tap Feed, Sleep or Nappy to add your first entry.</p>`;
  } else {
    const groups = [];
    sorted.forEach(x => { const k=dayKey(new Date(x.t)); let g=groups[groups.length-1]; if(!g||g.k!==k){ g={k,d:new Date(x.t),items:[]}; groups.push(g);} g.items.push(x); });
    const yest = new Date(today0); yest.setDate(yest.getDate()-1);
    groups.slice(0, showDays).forEach(g => {
      const label = g.k===dayKey(today0) ? "Today" : g.k===dayKey(yest) ? "Yesterday" : g.d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
      html += `<div class="day"><h3>${label}</h3><div class="list">${g.items.map(x => {
        const T = TYPES[x.type];
        let main = T.label, sub = [];
        if(x.type==="sleep") main = x.end ? `Slept ${dur(x.end-x.t)}` : "Sleeping now";
        if(x.type==="sleep" && x.end) sub.push(`woke ${fmtTime(new Date(x.end))}`);
        if(x.d) main += `: ${x.d}`;
        if(x.amt) sub.push(x.amt);
        if(x.note) sub.push(x.note);
        return `<div class="entry"><span class="t">${fmtTime(new Date(x.t))}</span><span class="d">${T.ic} ${esc(main)}${sub.length?`<small>${esc(sub.join(", "))}</small>`:""}</span><button data-del="${x.id}" aria-label="Delete entry">×</button></div>`;
      }).join("")}</div></div>`;
    });
    if(groups.length > showDays) html += `<button class="more" data-more>Show older days</button>`;
  }
  $("#view-log").innerHTML = html;
}

$("#view-log").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.new){
    const t = b.dataset.new;
    form = (t==="sleep" && openSleep()) ? {type:"sleep", mode:"wake"} : {type:t, mode:"new", opt:TYPES[t].opts[0]||""};
    renderLog(); return;
  }
  if(b.dataset.opt !== undefined){ form.opt = b.dataset.opt; renderLog(); return; }
  if(b.hasAttribute("data-cancel")){ form=null; renderLog(); return; }
  if(b.hasAttribute("data-save")){
    const tv = $("#f-time").value; const t = tv ? new Date(tv).getTime() : Date.now();
    if(form.mode==="wake"){
      const os = openSleep();
      if(t < os.t){ toast("Wake time is before the sleep started. Check the time."); return; }
      os.end = t;
    } else {
      const entry = {id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), type:form.type, t, d:form.opt||""};
      const amt = $("#f-amt"); if(amt && amt.value.trim()) entry.amt = amt.value.trim();
      const note = $("#f-note"); if(note && note.value.trim()) entry.note = note.value.trim();
      S.log.push(entry);
    }
    if(save()) toast("Saved");
    form = null; renderLog(); return;
  }
  if(b.dataset.del){
    if(confirm("Delete this entry?")){ S.log = S.log.filter(x=>x.id!==b.dataset.del); save(); renderLog(); }
    return;
  }
  if(b.hasAttribute("data-more")){ showDays += 7; renderLog(); }
});

/* ---------- Info view ---------- */
function applyTheme(){
  if(S.theme==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", S.theme);
}
function renderInfo(){
  $("#view-info").innerHTML = `<header class="hero"><h1>Safety &amp; info</h1></header>
  <div class="info">
  <div class="sleepcard"><h2>Safe sleep</h2><p>${SAFE_SLEEP}</p></div>
  <div class="doctor"><h2>Urgent signs</h2>${ALWAYS}<p style="margin-top:6px">If you're ever unsure, call your pediatrician. Many offices have an after-hours line.</p></div>
  <section><h2>Activities</h2><p>${ACT_SAFE} No equipment needed: your face, voice, hands and a blanket on the floor are enough.</p></section>
  <section><h2>About this guide</h2>
    <p>General information based on guidance from the CDC (“Learn the Signs. Act Early.”) and the American Academy of Pediatrics (HealthyChildren.org). It isn't medical advice.</p>
    <p>Babies develop at different speeds. Milestones are a guide, not a test. If something worries you, talk to your pediatrician.</p>
    <p>If your baby was born early, ask your pediatrician whether to use their corrected age.</p></section>
  <section><h2>Appearance</h2>
    <div class="seg" role="group" aria-label="Theme">${["auto","light","dark"].map(t=>`<button data-theme-set="${t}" aria-pressed="${S.theme===t}">${t==="auto"?"Automatic":t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div></section>
  <section><h2>Your data</h2>
    <p>Everything is saved only in this browser on this phone. Copy a backup now and then, and paste it somewhere safe like your notes app.</p>
    <div class="row"><button data-backup>Copy backup</button><button data-restore>Restore backup</button></div></section>
  <p class="fine">Birth date: ${new Date(BIRTH.year,BIRTH.month-1,BIRTH.day).toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})}</p>
  </div>`;
}
$("#view-info").addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.themeSet){ S.theme = b.dataset.themeSet; save(); applyTheme(); renderInfo(); }
  if(b.hasAttribute("data-backup")){
    const txt = JSON.stringify(S);
    try{ await navigator.clipboard.writeText(txt); toast("Backup copied. Paste it somewhere safe."); }
    catch(err){ prompt("Copy this backup text:", txt); }
  }
  if(b.hasAttribute("data-restore")){
    const txt = prompt("Paste your backup text. This replaces what's saved now.");
    if(!txt) return;
    try{ const o = JSON.parse(txt); if(!o || typeof o!=="object" || !Array.isArray(o.log)) throw 0; S = Object.assign(blank(), o); save(); applyTheme(); renderAll(); toast("Backup restored"); }
    catch(err){ toast("That doesn't look like a backup from this app. Nothing was changed."); }
  }
});

/* ---------- Tabs ---------- */
let tab = "week";
function showTab(t){
  tab = t;
  ["week","log","info"].forEach(x => $("#view-"+x).classList.toggle("hidden", x!==t));
  document.querySelectorAll("nav.tabs button").forEach(b => b.dataset.tab===t ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  if(t==="log") renderLog();
  if(t==="info") renderInfo();
  window.scrollTo(0,0);
}
document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.tab==="week" && tab==="week") view = currentWeek();
  if(b.dataset.tab==="week") renderWeek();
  showTab(b.dataset.tab);
});
function renderAll(){ renderWeek(); if(tab==="log") renderLog(); if(tab==="info") renderInfo(); }

/* Refresh age and "this week" when the app is reopened on a later day */
let lastDay = daysOld();
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState!=="visible") return;
  const d = daysOld();
  if(d !== lastDay){ lastDay = d; view = currentWeek(); }
  if(!form) renderAll();
});
setInterval(()=>{ if(tab==="log" && !form) renderLog(); }, 60000);

applyTheme();
renderWeek();
</script>
</body>
</html>
